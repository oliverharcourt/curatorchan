[project]
name = "curatorchan"
version = "0.1.0"
description = "A Discord bot for recommending anime."
readme = "README.md"
authors = [
    { name = "Oliver Harcourt", email = "96662442+oliverharcourt@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.5.2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.8",
    "numpy>=1.26.4",
    "pandas>=2.3.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.15.17",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.2",
    "tensorboard>=2.19.0",
    "torch>=2.10.0",
]

[project.scripts]
curatorchan = "curatorchan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
